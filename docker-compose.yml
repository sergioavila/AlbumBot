services:
  # Database Service (PostgreSQL with pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: albumbot_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=albumbot
    ports:
      - "5432:5432"
    volumes:
      - albumbot_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d albumbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: albumbot_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/albumbot
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    command: uvicorn app_main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  albumbot_data:
